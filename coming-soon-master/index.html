<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Base Apparel coming soon page</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page">
      <section class="card" aria-label="Coming soon announcement">
        <div class="content">
          <header class="brand" aria-label="Base Apparel home">
            <img src="images/logo.svg" alt="Base Apparel logo" class="logo" />
          </header>

          <div class="hero-copy">
            <p class="eyebrow">We're</p>
            <h1>
              <span>coming</span>
              soon
            </h1>
            <p class="lead">
              Hello fellow shoppers! We're currently building our new fashion store.
              Add your email below to stay up to date with announcements and our
              launch deals.
            </p>
          </div>

          <form id="email-form" class="newsletter-form" novalidate>
            <label class="sr-only" for="email">Email address</label>
            <div class="input-wrap">
              <input
                type="email"
                id="email"
                name="email"
                placeholder="Email Address"
                aria-describedby="error-message"
                required
              />
              <button type="submit" aria-label="Submit email">
                <img src="images/icon-arrow.svg" alt="" aria-hidden="true" />
              </button>
            </div>
            <p id="error-message" class="error-message" aria-live="polite"></p>
          </form>
        </div>

        <aside class="visual" aria-label="Fashion model image">
          <picture>
            <source media="(max-width: 700px)" srcset="images/hero-mobile.jpg" />
            <img src="images/hero-desktop.jpg" alt="Woman wearing a neutral-toned outfit" class="hero-image" />
          </picture>
        </aside>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
